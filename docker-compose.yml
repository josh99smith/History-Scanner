services:
  history-scanner:
    build: .
    image: history-scanner
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sensible in-container defaults; .env (above) overrides these.
      DATA_DIR: /data
      HF_HOME: /models
    volumes:
      # Persist downloaded models (multi-GB) and OCR results across restarts.
      - marker-models:/models
      - scanner-data:/data
    restart: unless-stopped

  # GPU variant: `docker compose --profile gpu up history-scanner-gpu`
  # Requires the NVIDIA Container Toolkit and a CUDA-based image (see Dockerfile).
  history-scanner-gpu:
    extends: history-scanner
    profiles: ["gpu"]
    environment:
      TORCH_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Public access: a Cloudflare tunnel that exposes the app on a public HTTPS URL
  # reachable from your phone anywhere — no port-forwarding, no static IP.
  #   • Quick tunnel (random *.trycloudflare.com URL):  docker compose --profile public up
  #     then read the printed https://<random>.trycloudflare.com URL from the logs.
  #   • Stable named tunnel: set TUNNEL_TOKEN in .env (from the Cloudflare dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: >
      sh -c 'if [ -n "$$TUNNEL_TOKEN" ];
             then cloudflared tunnel --no-autoupdate run --token "$$TUNNEL_TOKEN";
             else cloudflared tunnel --no-autoupdate --url http://history-scanner:8000; fi'
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - history-scanner
    restart: unless-stopped

volumes:
  marker-models:
  scanner-data:
