name: Deploy GitHub Pages

# Publishes the static browser app in docs/ to GitHub Pages.
# Enable it once under: repo Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches:
      - main
      - claude/document-scanner-marker-ocr-WHmDp
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
